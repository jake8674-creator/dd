name: FrameFit iPad build check
on:
  push:
    branches: [main]
    paths: ['rebuild/**', '.github/workflows/framefit-ios-check.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: framefit-ipad-check
  cancel-in-progress: true
jobs:
  check:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Compile with Apple SDK and launch on iPad simulator
        id: check
        shell: bash
        run: |
          mkdir -p ios-report
          set +e
          bash rebuild/scripts/apple-check.sh > ios-report/build.log 2>&1
          result=$?
          echo "$result" > ios-report/exit-code.txt
          git rev-parse HEAD > ios-report/source-commit.txt
          cat ios-report/build.log
          exit "$result"
      - name: Publish diagnostic results to dedicated branch
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/framefit-report
          cp ios-report/*.txt /tmp/framefit-report/ 2>/dev/null || true
          cp ios-report/build.log /tmp/framefit-report/ 2>/dev/null || true
          cp ios-report/ipad-launch.png /tmp/framefit-report/ 2>/dev/null || true
          git fetch origin framefit-build-results || true
          if git show-ref --verify --quiet refs/remotes/origin/framefit-build-results; then
            git worktree add /tmp/framefit-results origin/framefit-build-results
          else
            git worktree add --detach /tmp/framefit-results HEAD
            cd /tmp/framefit-results
            git checkout --orphan framefit-build-results
            git rm -rf .
          fi
          cd /tmp/framefit-results
          cp /tmp/framefit-report/* .
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git diff --cached --quiet || git commit -m 'Record iPad build and launch check'
          git push origin HEAD:refs/heads/framefit-build-results
